# Builds an installable Android APK in the cloud.
# Needs repository secrets UNITY_EMAIL and UNITY_PASSWORD (Unity Personal account, no 2FA).
# Phone download: the "apk" release — releases/latest/download/PofudukFilo.apk (also a run artifact).
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - "tools/ci/**"
      - ".github/workflows/android.yml"

concurrency:
  # One build at a time: each holds the account's single Personal seat.
  group: android-build
  cancel-in-progress: false

permissions:
  contents: write # publish the APK to the "apk" release

env:
  UNITY_IMAGE: unityci/editor:ubuntu-6000.3.24f1-android-3

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space (the Android editor image is large)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Android-

      - name: Fetch UI font (Fredoka, SIL OFL 1.1)
        continue-on-error: true
        run: |
          mkdir -p Assets/_Project/Fonts
          base="https://raw.githubusercontent.com/google/fonts/main/ofl/fredoka"
          curl -fsSL -o Assets/_Project/Fonts/Fredoka.ttf "$base/Fredoka%5Bwdth%2Cwght%5D.ttf" \
            && curl -fsSL -o Assets/_Project/Fonts/Fredoka-OFL.txt "$base/OFL.txt" \
            && ls -l Assets/_Project/Fonts

      - name: Pull Unity image
        run: docker pull "$UNITY_IMAGE"

      - name: Activate license, build APK, return license
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          docker run --rm \
            -e UNITY_EMAIL -e UNITY_PASSWORD -e PROJECT_PATH=/project \
            -v "$GITHUB_WORKSPACE":/project \
            "$UNITY_IMAGE" \
            bash /project/tools/ci/build-android.sh

      - name: Fix file ownership (container ran as root)
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PofudukFilo-apk
          path: build/Android/*.apk
          if-no-files-found: error

      - name: Publish APK to the "apk" release (direct phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Build ${{ github.run_number }} · ${GITHUB_SHA::7}. Eski sürümü kaldırıp bu APK'yı kurun."
          if gh release view apk >/dev/null 2>&1; then
            gh release upload apk build/Android/PofudukFilo.apk --clobber
            gh release edit apk --notes "$notes" --latest
          else
            gh release create apk build/Android/PofudukFilo.apk --title "Pofuduk Filo APK" --notes "$notes" --latest
          fi

      - name: QA run — autopilot screenshots and telemetry (Xvfb, software GL)
        id: qa
        continue-on-error: true
        timeout-minutes: 15
        run: |
          mkdir -p qa
          cp -r build/logs qa/ 2>/dev/null || true
          if [ ! -x build/Linux/PofudukFilo.x86_64 ]; then echo "No QA player."; exit 0; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglu1-mesa > /dev/null
          timeout 600 xvfb-run -a -s "-screen 0 720x1400x24" \
            build/Linux/PofudukFilo.x86_64 -force-glcore -screen-fullscreen 0 \
            -screen-width 540 -screen-height 1170 -qa-shots "$PWD/qa" -qa-seconds 300 \
            -logFile "$PWD/qa/player.log" || echo "Player exited with $?"
          ls -la qa
          cat qa/telemetry.txt 2>/dev/null | head -80 || true

      - name: Publish QA evidence to the qa-shots branch
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d qa ] || exit 0
          cd qa
          echo "Run ${{ github.run_number }} · ${GITHUB_SHA::7}" > RUN.txt
          git init -q -b qa-shots
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "QA evidence: run ${{ github.run_number }} (${GITHUB_SHA::7})"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" qa-shots
